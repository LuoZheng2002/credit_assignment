# Uniform-weight ablation of the positive-only pinned-question control:
# identical to common_lora_control.toml except positive advantages are
# binarized to 1.0 in the loss, so credit MAGNITUDES carry no information.
# Compare against notool_control_pos (same pinned questions, seed 0) to
# isolate the contribution of credit weighting over plain rejection sampling.
training_plan = "lora"
advantage_clip = 3.0
learning_rate = 1e-4
weight_decay = 0.01
grad_accum_steps = 8
log_time_interval = 30
checkpoint_save_time_interval = 1800
seed = 42
uniform_positive_advantage = true
# lora specific
lora_rank = 64
lora_alpha = 128
lora_dropout = 0.1
lora_target_modules_csv = "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
resume_checkpoint_tag = "auto"

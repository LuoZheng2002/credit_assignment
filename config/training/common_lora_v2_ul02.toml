# v2 +/- advantage arm, take 2: unlikelihood negative term at 0.2x weight.
# At 1.0x the suppression pressure damaged the model (val 0.643 -> 0.595 after
# one epoch) even though the objective stayed numerically stable.
training_plan = "lora"
advantage_clip = 3.0
learning_rate = 1e-4
weight_decay = 0.01
grad_accum_steps = 8
log_time_interval = 30
checkpoint_save_time_interval = 1800
seed = 42
negative_loss_mode = "unlikelihood"
negative_loss_weight = 0.2
# lora specific
lora_rank = 64
lora_alpha = 128
lora_dropout = 0.1
lora_target_modules_csv = "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
resume_checkpoint_tag = "auto"

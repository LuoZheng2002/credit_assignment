# v3b: v3 + KL anchor. The per-token clip alone let sequence-level drift
# compound (grpo arm: sampled-rollout 0.61 -> 0.34 -> dead in 3 epochs while
# greedy val still read 0.65). kl_beta follows the GRPO reference recipe.
# Single-variable change vs common_lora_v3.toml for a clean fix attribution.
training_plan = "lora"
advantage_clip = 3.0
learning_rate = 1e-4
weight_decay = 0.01
grad_accum_steps = 8
log_time_interval = 30
checkpoint_save_time_interval = 1800
seed = 42
loss_objective = "ppo_clip"
clip_epsilon = 0.2
kl_beta = 0.04
negative_loss_weight = 1.0
# lora specific
lora_rank = 64
lora_alpha = 128
lora_dropout = 0.1
lora_target_modules_csv = "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
resume_checkpoint_tag = "auto"

training_plan = "fsdp"
advantage_clip = 3.0
learning_rate = 2e-06
weight_decay = 0.01
grad_accum_steps = 16
log_time_interval = 30
lr_warmup_steps = 100
seed = 42
adam_beta1 = 0.9
adam_beta2 = 0.95
# lora fields are unused for fsdp training plan
lora_rank = 64
lora_alpha = 128
lora_dropout = 0.1

kl_and_ema_enabled = true
kl_penalty_coefficient = 0.03
ema_decay = 0.99

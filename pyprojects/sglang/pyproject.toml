[project]
name = "credit-assignment-sglang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # Pin to the torch version required by your sglang release.
    # Example: "torch==2.8.0"
    "torch",
    "torchvision",
    "torchaudio",
    # "pybase64",
    "transformers==v5.6.0",
    "kernels>=0.12.0,<0.13",
    # "flashinfer-python",
    "sglang==v0.5.12.post1",
    # "sglang-kernel",
    "sglang-kernel @ https://github.com/sgl-project/whl/releases/download/v0.4.2.post2/sglang_kernel-0.4.2.post2+cu130-cp310-abi3-manylinux2014_x86_64.whl#sha256=4e7ce619274234d182b20da883fcf1d20e7e55cbea90d62244e2b6a3d6c0fc85",
    #
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

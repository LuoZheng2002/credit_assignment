[project]
name = "credit-assignment-sglang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    # transformers pinned to match sglang 0.5.10.post1 requirement
    "transformers==v5.3.0",
    "kernels>=0.12.0,<0.13",
    "flashinfer-python",
    # sglang 0.5.10.post1 is the last version fully compatible with CUDA 12.x.
    # 0.5.11+ requires cuda-python>=13.0 which is CUDA 13.x only.
    "sglang==v0.5.10.post1",
    # ninja is required by flashinfer JIT kernel compilation at runtime
    "ninja",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"

# Delta HPC has CUDA 12.8 — use the cu128 PyTorch index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# sglang-kernel 0.4.1 only ships as cu130 — patch 0.4.2+cu129 to version 0.4.1 locally
sglang-kernel = { path = "wheels/sglang_kernel-0.4.1-cp310-abi3-manylinux2014_x86_64.whl" }

syntax = "proto3";

package vllm_wrapper.v1;

message TokenIds {
  repeated int32 token_ids = 1;
}

message VllmPrompt {
  oneof prompt {
    string text = 1;
    TokenIds token_ids = 2;
  }
}

message VllmRequest {
  string model_name = 1;
  VllmPrompt prompt = 2;
  uint32 max_tokens = 3;
  bool include_stop_str_in_output = 4;
  bool requires_logprobs = 5;
  repeated string stop = 6;
  float temperature = 7;
}

message VllmLogprob {
  int32 token_id = 1;
  float logprob = 2;
}

message TopLogprobs {
  repeated VllmLogprob candidates = 1;
}

message VllmLogprobs {
  repeated int32 tokens = 1;
  repeated float token_logprobs = 2;
  repeated TopLogprobs top_logprobs = 3;
}

message VllmSuccess {
  string response_text = 1;
  VllmLogprobs logprobs = 2;
}

message VllmError {
  string error_message = 1;
}

message VllmResponse {
  oneof response {
    VllmSuccess success = 1;
    VllmError error = 2;
  }
}

service VllmWrapper {
  rpc Generate(VllmRequest) returns (VllmResponse);
}

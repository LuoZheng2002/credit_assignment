[project]
name = "credit-assignment-common"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "datasets>=4.8.5",
    "python-dotenv>=1.0.0",
    "research-utility",
    "torch==2.9.1+cu128",
    "transformers",
    "tiktoken",
    "sentencepiece",
    "accelerate",
    "socksio>=1.0.0",
    "matplotlib>=3.10.9",
    "peft",
    # used for LLM python tool calling
    "sympy>=1.14.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "numexpr>=2.14.1",
    "flash-linear-attention",
    "kernels>=0.12.0,<0.13",
    # "causal-conv1d",
    "jsonargparse>=4.42.0",
    "modal>=1.4.4.dev21",
    "pydantic==2.11.7",
    "httpx",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
research-utility = { path = "research-utility", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux'"]
prerelease = "allow"
